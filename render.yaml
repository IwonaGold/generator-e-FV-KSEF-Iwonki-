services:
  - type: web
    name: generator-e-FV-KSEF-Iwonki-
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
