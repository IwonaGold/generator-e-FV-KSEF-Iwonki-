<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centrum Obsługi Zamówień Sieciowych</title>
    <link id="app-favicon" rel="icon" type="image/png" href="/app-logo.png" />
    <link id="app-apple-icon" rel="apple-touch-icon" href="/app-logo.png" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var role = (params.get('role') || params.get('stanowisko') || '').toLowerCase();
          var stored = localStorage.getItem('iwonka_ksef_workstation_name_v1') || sessionStorage.getItem('iwonka_ksef_workstation_name_v1') || '';
          var isWarehouse = role === 'warehouse' || role === 'magazyn' || (stored && (stored.toLowerCase().indexOf('magazyn') !== -1 || stored.indexOf('2.') === 0));
          if (isWarehouse) {
            document.title = 'Magazyn WMS – Zadania Magazynowe';
            var fav = document.getElementById('app-favicon');
            if (fav) fav.href = '/wms-logo.png';
            var apple = document.getElementById('app-apple-icon');
            if (apple) apple.href = '/wms-logo.png';
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Centrum Obsługi Zamówień Sieciowych: wczytywanie zamówień DOZ, Dr. Max, Super-Pharm, Gemini, korekty faktur KSeF, weryfikacja cen z cennikiem oraz kod XML FA(3)." />
    <meta property="og:title" content="Centrum Obsługi Zamówień Sieciowych" />
    <meta property="og:description" content="Centrum Obsługi Zamówień Sieciowych dla Iwonki: e-faktury KSeF FA(3), korekty faktur, weryfikacja cenników i historia zamówień." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
